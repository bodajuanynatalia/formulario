<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Boda Juan & Natalia — 27 de junio de 2026</title>
  <meta name="description" content="Confirma tu asistencia a la boda de Juan & Natalia (Comillas, 27 de junio de 2026)." />

  <meta property="og:title" content="Boda Juan & Natalia — 27 de junio de 2026" />
  <meta property="og:description" content="Confirma tu asistencia a la boda de Juan & Natalia (Comillas)." />
  <meta property="og:image" content="preview.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Libre+Baskerville:wght@400&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f7f5f2; --text:#1f2328; --muted:#5f5c56;
      --gold:#c7a66a; --line:#e8e2d9; --card:#ffffffee;
      --radius:20px; --shadow:0 18px 36px rgba(0,0,0,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:Inter, system-ui, sans-serif;
      background:var(--bg); color:var(--text);
      padding-bottom:120px;
    }
    .wrap{max-width:820px;margin:0 auto;padding:22px}

    header{text-align:center}
    .title{
      font-family:'Libre Baskerville', serif;
      font-weight:400;
      font-size:40px;
      margin:0 0 6px;
    }
    .sub{color:#3a3f45;margin-bottom:12px}

    .countdown{display:flex;gap:10px;justify-content:center}
    .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px}

    .hero{display:flex;justify-content:center;margin:18px 0}
    .hero img{
      width:min(900px,96%);
      border-radius:26px;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:22px;
    }
    h2{
      font-family:'Libre Baskerville', serif;
      font-weight:400;
      font-size:24px;
      margin:0 0 10px;
    }

    label{font-weight:500;font-size:14px;margin-bottom:6px;display:block}
    .grid{display:grid;grid-template-columns:1fr;gap:16px}
    input{
      width:100%;
      border:1px solid #dcd5c8;
      border-radius:14px;
      padding:12px 14px;
      font-size:15px;
    }
    .hidden{display:none}
    .hint{font-size:12px;color:var(--muted)}

    .seg{display:flex;gap:10px;flex-wrap:wrap}
    .seg .btn{
      border:1.5px solid #dcd5c8;
      background:#fff;
      padding:10px 16px;
      border-radius:999px;
      cursor:pointer;
    }
    .seg .btn.active{
      border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(199,166,106,.18);
    }

    .send{
      display:flex;
      justify-content:center;
      gap:12px;
      margin-top:10px;
      margin-bottom:120px;
    }

    .btn-primary{
      border:1.5px solid var(--gold);
      background:#fff;
      padding:12px 26px;
      border-radius:999px;
      cursor:pointer;
    }

    .floating-rsvp{
      position:fixed;
      bottom:16px;
      left:0;right:0;
      display:flex;
      justify-content:center;
      gap:14px;
    }
    .rbtn{
      width:110px;height:110px;
      border-radius:50%;
      border:1.5px solid var(--gold);
      background:#fff;
      cursor:pointer;
    }
    .rbtn.active{
      outline:3px solid rgba(199,166,106,.35);
    }
  </style>
</head>

<body>
<div class="wrap">
  <header>
    <h1 class="title">Boda Juan & Natalia</h1>
    <p class="sub">Sábado <strong>27 de junio de 2026</strong> · Comillas</p>
    <div class="countdown">
      <span class="pill"><b id="dd">--</b> días</span>
      <span class="pill"><b id="hh">--</b> h</span>
      <span class="pill"><b id="mm">--</b> m</span>
      <span class="pill"><b id="ss">--</b> s</span>
    </div>
  </header>

  <div class="hero">
    <img src="finca.jpg" alt="Casería de la Mar">
  </div>

  <main class="card">
    <h2>Confirma tu asistencia</h2>

    <form id="rsvp" action="https://script.google.com/macros/s/AKfycbyBvoPHWbOIgCyp1lKgObxo2yvplq-pgs9T2NyE1shO4WTTQ3q_ckkYrCaepe3QMFIf/exec" method="POST">
      <input type="hidden" name="asistencia" id="asistencia">
      <input type="hidden" name="preboda" id="preboda">

      <div class="grid">
        <div>
          <label>Nombre y apellidos</label>
          <input name="nombre" required>
        </div>

        <div>
          <label>¿Asistirás a la preboda?</label>
          <div class="seg" id="seg-preboda">
            <button type="button" class="btn" data-val="si">Sí</button>
            <button type="button" class="btn" data-val="no">No</button>
          </div>
          <div class="hint">Viernes 26 · 19:30</div>
        </div>
      </div>

      <div class="send">
        <button class="btn-primary">Enviar confirmación</button>
      </div>
    </form>
  </main>
</div>

<div class="floating-rsvp">
  <button class="rbtn" data-val="si">Asistiré</button>
  <button class="rbtn" data-val="no">No puedo</button>
</div>

<script>
const eventDate = new Date('2026-06-27T17:00:00');
setInterval(()=>{
  const d = Math.max(0, eventDate - new Date());
  const s = Math.floor(d/1000);
  dd.textContent=Math.floor(s/86400);
  hh.textContent=Math.floor((s%86400)/3600);
  mm.textContent=Math.floor((s%3600)/60);
  ss.textContent=s%60;
},1000);

function makeSegmented(id,inputId){
  const wrap=document.getElementById(id);
  const input=document.getElementById(inputId);
  wrap.querySelectorAll('.btn').forEach(b=>{
    b.onclick=()=>{
      input.value=b.dataset.val;
      wrap.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    }
  });
}

makeSegmented('seg-preboda','preboda');

document.querySelectorAll('.rbtn').forEach(b=>{
  b.onclick=()=>{
    asistencia.value=b.dataset.val;
    document.querySelectorAll('.rbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  }
});
</script>
</body>
</html>
